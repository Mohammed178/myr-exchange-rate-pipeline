name: Daily exchange rate load

on:
  schedule:
    # 10:00 UTC = 18:00 MYT, Monday to Friday.
    # Cron runs in UTC, and GitHub may start scheduled runs a few minutes late.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

concurrency:
  group: daily-load         # never let two runs overlap
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, validate and load
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python load.py
